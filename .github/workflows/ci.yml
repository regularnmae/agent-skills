name: ci

# `refresh.py --check` is deliberately absent: it needs a live MCP gateway and
# tokens, so it belongs on the host, not in a pull-request job. The unit tests
# cover everything that does not need the network, including the guard that
# refuses to publish spending tools in a skill that claims to be read-only.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: lint
        if: matrix.python == '3.13'
        run: |
          python -m pip install --quiet ruff
          ruff check .
