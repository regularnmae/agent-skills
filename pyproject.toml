[project]
name = "agent-skills"
version = "0.1.0"
description = "Agent skills wrapping this stack's read-only crypto MCP servers"
requires-python = ">=3.9"

# Scripts, not a package: `uv run ruff` would otherwise try to build a wheel.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["lib", "refresh.py"]
extraPaths = ["lib"]
pythonVersion = "3.9"
